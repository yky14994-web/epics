<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진입대원 종합관제 시스템(EPICS) (조회 전용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B3A5F; --navy-2:#3E5F82; --amber:#BA7517; --red:#A32D2D; --blue:#2F6FAE;
    --bg:#F7F6F2; --card:#FFFFFF; --border:#E1DED4;
    --text:#2C2C2A; --text-muted:#5F5E5A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nanum Gothic', sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px;}
  button, .btn, .btn-secondary{transition: transform 0.08s ease, opacity 0.08s ease;}
  button:active, .btn:active, .btn-secondary:active{transform: scale(0.95); opacity: 0.75;}
  header{background:var(--navy);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;}
  header h1{margin:0;font-size:20px;font-weight:800;line-height:1.35;}
  .h1sub{display:block;font-size:12.5px;font-weight:600;color:#C7D2DE;margin-top:2px;letter-spacing:0.2px;}
  .syncdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#1E7A34;}
  .syncdot.bad{background:#E24B4A;}
  .sync{font-size:13px;color:#C7D2DE;}
  .dateBar{background:#0F2A47;color:#fff;padding:12px 22px;display:flex;align-items:center;gap:12px;font-size:15px;}
  .dateBar input{padding:8px 10px;border-radius:6px;border:none;font-family:inherit;font-size:15px;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px;}
  .setup{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
  .urlbox{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-size:13px;font-family:monospace;}
  .btn{margin-top:8px;width:100%;padding:10px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-family:inherit;font-size:14px;font-weight:700;}
  .status-grid{display:flex;gap:14px;margin-bottom:20px;}
  .stat{flex:1;background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
  .stat .num{font-size:40px;font-weight:800;color:var(--navy);}
  .stat .label{font-size:14px;color:var(--text-muted);margin-top:4px;}
  #statIn{color:var(--red);}
  #statOut{color:var(--blue);}
  .badge{font-size:12px;padding:2px 8px;border-radius:6px;display:inline-block;margin-left:6px;}
  .badge-warn{background:#FAEEDA;color:var(--amber);}
  .badge-lead{background:#EAF0F6;color:var(--navy);font-weight:700;}
  .airbar{height:9px;background:#EEE;border-radius:5px;overflow:hidden;margin-bottom:4px;}
  .empty{font-size:15px;color:var(--text-muted);text-align:center;padding:30px 0;}
  .hist-line{font-size:14px;color:var(--text-muted);margin-top:4px;line-height:1.6;}
  .hist-line.enter-state{color:var(--red);font-weight:700;}
  .hist-line.exit-state{color:var(--blue);}
  .personRow{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
  .personRow .pname{font-weight:700;font-size:17px;}
  .personRow .porg{font-size:14px;color:var(--text-muted);margin-top:3px;}
  .personRow.air-critical{border-color:var(--red);border-width:2px;background:#FDECEC;box-shadow:0 0 0 2px rgba(163,45,45,0.2);}
  html{scroll-behavior:smooth;}
  .scrollTopBtn{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:rgba(27,58,95,0.6);color:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,0.25);z-index:60;text-decoration:none;border:1px solid rgba(255,255,255,0.4);}
  .btn-secondary{width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--navy);margin-top:6px;}
  .note{font-size:13px;color:var(--text-muted);}
  .parGroup{margin-bottom:12px;}
  .parGroupHead{font-size:14px;font-weight:700;color:var(--navy-2);margin-bottom:4px;}
  .parPanelCard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:10px;}
</style>
</head>
<body>

<header>
  <h1>진입대원 종합관제 시스템<span class="h1sub">EPICS · 조회 전용</span></h1>
  <div class="sync"><span class="syncdot" id="syncDot"></span><span id="syncText">동기화 대기 중</span></div>
</header>
<div class="dateBar">
  상황(출동) 일자
  <input type="date" id="incidentDateInput">
  <span id="weekdayLabel" style="font-weight:700;"></span>
  <span id="liveClock" style="font-weight:700;margin-left:8px;"></span>
  <button id="settingsToggle" title="환경설정" aria-label="환경설정" style="margin-left:auto;background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:15px;flex-shrink:0;">⚙</button>
</div>

<div class="wrap">

  <div class="setup" id="setupBox" style="display:none;">
    <input type="text" id="apiUrlInput" class="urlbox" placeholder="안전점검관용과 동일한 Apps Script 웹앱 주소(.../exec)를 붙여넣으세요">
    <button class="btn" id="saveUrlBtn">저장 후 조회 시작</button>
  </div>

  <div class="status-grid">
    <div class="stat"><div class="num" id="statIn">0</div><div class="label">진입 중</div></div>
    <div class="stat"><div class="num" id="statOut">0</div><div class="label">철수 완료</div></div>
    <div class="stat"><div class="num" id="statWarn">0</div><div class="label">잔량 경고</div></div>
  </div>

  <button class="btn-secondary" id="parBtn">전원점검(PAR) 장소별 보기</button>
  <div id="parPanel"></div>

  <div id="statusList" style="margin-top:16px;"></div>
  <div class="empty" id="emptyMsg" style="display:none;">아직 입력된 대원이 없습니다.</div>

</div>

<a href="#" class="scrollTopBtn" title="맨 위로" aria-label="맨 위로">↑</a>

<script>
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  const WEEKDAY_KR = ['일','월','화','수','목','금','토'];
  function updateWeekdayLabel(){
    const el = document.getElementById('weekdayLabel');
    const v = document.getElementById('incidentDateInput').value;
    if(!el) return;
    if(!v){ el.textContent = ''; return; }
    const d = new Date(v + 'T00:00:00');
    el.textContent = isNaN(d.getTime()) ? '' : `(${WEEKDAY_KR[d.getDay()]})`;
  }
  function updateLiveClock(){
    const el = document.getElementById('liveClock');
    if(el) el.textContent = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  document.getElementById('incidentDateInput').value = todayStr();
  updateWeekdayLabel();
  document.getElementById('incidentDateInput').addEventListener('change', () => { updateWeekdayLabel(); render(); });

  let ROSTER = [];
  const SCANLOG_KEY = 'fireScanLog_v1';
  function pruneOldLog(log){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    return (log || []).filter(e => !e.incidentDate || e.incidentDate >= cutoffStr);
  }
  function loadScanLogFromStorage(){
    try{
      const raw = localStorage.getItem(SCANLOG_KEY);
      if(!raw) return [];
      return pruneOldLog(JSON.parse(raw));

  }

  function currentDate(){ return document.getElementById('incidentDateInput').value; }
  function normalizeIncidentDate(v){
    if(!v) return v;
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    const d = new Date(v);
    if(!isNaN(d.getTime())){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }
    return v;
  }
  function visibleLog(){ return scanLog.filter(e => e.incidentDate === currentDate()); }
  function getResetTime(date){
    let t = 0;
    scanLog.forEach(e => { if(e.action === 'reset' && e.incidentDate === date && e.time > t) t = e.time; });
    return t;
  }

  async function fetchAllOnce(){
    const res = await fetch(`${API_URL}?_=${Date.now()}`, {cache:'no-store'});
    const data = await res.json();
    if(!data || !Array.isArray(data.roster)) throw new Error('형식이 올바르지 않은 응답');
    return data;
  }

  let fetchInProgress = false;
  async function fetchAll(){
    if(fetchInProgress) return;
    fetchInProgress = true;
    try{
      await fetchAllInner();
    }finally{
      fetchInProgress = false;
    }
  }

  async function fetchAllInner(){
    if(!API_URL){
      if(ROSTER.length === 0){ ROSTER = DEMO_ROSTER; scanLog = buildDemoLog(); }
      syncDot.classList.remove('bad');
      syncDot.style.background = '#BA7517';
      syncText.textContent = '테스트 모드 · 샘플 데이터 표시 중 (저장소 미연결)';
      render();
      return;
    }
    let data = null;
    for(let attempt = 0; attempt < 3; attempt++){
      try{
        data = await fetchAllOnce();
        break;
      }catch(err){
        if(attempt < 2) await new Promise(r => setTimeout(r, 400));
      }
    }
    if(data){
      ROSTER = data.roster || [];
      const serverLog = (data.log || []).map(r => ({
        id:r.id, name:r.name, action:r.action, floor:r.floor, zone:r.zone,
        time:Number(r.time), source:r.source, estimated: r.estimated===true||r.estimated==='TRUE',
        airCap: r.airCap, airMode: r.airMode, incidentDate: normalizeIncidentDate(r.incidentDate), org: r.org, rank: r.rank
      }));
      serverLog.forEach(se => {
        const isDup = scanLog.some(e => e.id === se.id && e.action === se.action && Math.abs(e.time - se.time) < 60000);
        if(!isDup) scanLog.push(se);
      });
      scanLog.sort((a,b)=>a.time-b.time);
      saveScanLogToStorage();
      lastSyncTime = Date.now();
      updateSyncStatus();
      render();
    }else{
      updateSyncStatus();
    }
  }

  function updateSyncStatus(){
    if(!API_URL) return;
    if(lastSyncTime === null){
      syncDot.classList.add('bad');
      syncText.textContent = '동기화 대기 중';
      return;
    }
    const secAgo = Math.floor((Date.now() - lastSyncTime) / 1000);
    const timeLabel = new Date(lastSyncTime).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if(secAgo < 20){
      syncDot.classList.remove('bad');
      syncDot.style.background = '';
      syncText.textContent = `동기화됨 · ${timeLabel}`;
    }else{
      syncDot.classList.add('bad');
      syncText.textContent = `동기화 지연 · 마지막 성공 ${timeLabel} (재시도 중)`;
    }
  }

  function orgColor(org){
    if(org.includes('구조대')) return '#E4002B';
    if(org.includes('구급대')) return '#2E8B57';
    if(org.includes('센터')) return '#6B7280';
    return '#3E5F82';
  }
  function orgEmoji(org){
    if(org.includes('구조대')) return '🪓';
    if(org.includes('구급대')) return '✚';
    if(org.includes('센터')) return '🚒';
    return '🚩';
  }
  function roleTag(p){ return p.role ? ` <span class="badge badge-lead">${p.role}</span>` : ''; }
  function orgRank(org){
    const orgOrder = [...new Set(ROSTER.map(r => r.org))];
    const i = orgOrder.indexOf(org);
    return i === -1 ? orgOrder.length : i;
  }
  function displayRoster(){
    const seen = new Set(ROSTER.map(p => p.id));
    const extra = [];
    visibleLog().forEach(e => {
      if(!seen.has(e.id)){
        seen.add(e.id);
        extra.push({id:e.id, org:e.org || '미등록', rank:e.rank || '-', name:e.name});
      }
    });
    return ROSTER.concat(extra);
  }

  function fmtClock(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function fmtElapsed(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000); return m+'분 '+s+'초'; }
  function fmtDurShort(ms){ return Math.round(Math.max(0,ms)/60000)+'분'; }
  function airLevel(remainMs, totalMs){
    const pct = totalMs>0 ? remainMs/totalMs*100 : 0;
    if(pct > 50) return {c:'#639922', label: Math.max(0,Math.round(pct))+'% 남음'};
    if(pct > 20) return {c:'#BA7517', label: Math.max(0,Math.round(pct))+'% 남음'};
    return {c:'#A32D2D', label: pct>0 ? Math.round(pct)+'% 남음' : '한도 초과'};
  }
  function personCycles(id){
    const resetTime = getResetTime(currentDate());
    const evs = visibleLog().filter(e => e.id === id && e.time >= resetTime).sort((a,b) => a.time - b.time);
    const cycles = []; let cur = null; let prevRemainAtExit = null;
    evs.forEach(e => {
      if(e.action === 'in'){
        const airCapSelected = Number(e.airCap) || 50;
        const airMode = e.airMode || 'new';
        const startAirMs = (airMode === 'continue' && prevRemainAtExit !== null) ? prevRemainAtExit : airCapSelected*60000;
        cur = {enteredAt:e.time, exitedAt:null, floor:e.floor, zone:e.zone, startAirMs, airMode};
        cycles.push(cur);
      }else if(e.action === 'out' && cur && cur.exitedAt === null){
        cur.exitedAt = e.time;
        const elapsedAtExit = Math.max(0, cur.exitedAt - cur.enteredAt);
        prevRemainAtExit = Math.max(0, cur.startAirMs - elapsedAtExit);
      }else if(e.action === 'move' && cur && cur.exitedAt === null){
        cur.floor = e.floor; cur.zone = e.zone;
      }
    });
    return cycles;
  }
  function cumulative(cycles, now){ let s=0; cycles.forEach(c => { s += (c.exitedAt ?? now) - c.enteredAt; }); return s; }
  function sameDay(a, b){
    const da=new Date(a), db=new Date(b);
    return da.getFullYear()===db.getFullYear() && da.getMonth()===db.getMonth() && da.getDate()===db.getDate();
  }
  function historyHtml(cycles, now){
    return cycles.map((c,i) => {
      const num = i+1;
      if(c.exitedAt !== null){
        const exitLabel = sameDay(c.enteredAt, c.exitedAt) ? fmtClock(c.exitedAt) : '익일 '+fmtClock(c.exitedAt);
        return `<div class="hist-line exit-state">${num}차 ${fmtClock(c.enteredAt)}~${exitLabel} · ${c.floor}·${c.zone} (활동 ${fmtDurShort(c.exitedAt-c.enteredAt)})</div>`;
      }else{
        const nowLabel = sameDay(c.enteredAt, now) ? fmtClock(now) : '익일 '+fmtClock(now);
        return `<div class="hist-line enter-state">${num}차 ${fmtClock(c.enteredAt)}~진행중(${nowLabel}) · ${c.floor}·${c.zone} (${fmtElapsed(now-c.enteredAt)})</div>`;
      }
    }).join('');
  }

  function render(){
    updateLiveClock();
    updateSyncStatus();
    const list = document.getElementById('statusList');
    const emptyMsg = document.getElementById('emptyMsg');
    list.innerHTML = '';
    let cIn=0, cOut=0, cWarn=0;
    const now = Date.now();

    const roster = displayRoster()
      .map(p => ({ p, cycles: personCycles(p.id) }))
      .filter(x => x.cycles.length > 0)
      .sort((a, b) => b.cycles[0].enteredAt - a.cycles[0].enteredAt);
    emptyMsg.style.display = roster.length === 0 ? 'block' : 'none';

    roster.forEach(({p, cycles}) => {
      const n = cycles.length;
      const last = cycles[n-1];
      const isIn = last.exitedAt === null;
      if(isIn) cIn++; else cOut++;

      const badgeHtml = n>1 ? `<span class="badge badge-warn">${n}차 진입 · 누적 ${fmtDurShort(cumulative(cycles, now))}</span>` : '';
      let airHtml = '';
      let air = null;
      if(isIn){
        const totalMs = last.startAirMs;
        const elapsed = now - last.enteredAt;
        const remain = totalMs - elapsed;
        air = airLevel(remain, totalMs);
        if(air.c === '#A32D2D') cWarn++;
        airHtml = `<div class="airbar" style="margin-top:8px;"><div style="height:100%;width:${Math.max(0,Math.min(100,remain/totalMs*100))}%;background:${air.c};"></div></div><div style="font-size:14px;color:${air.c};">${air.label} · ${last.airMode==='continue'?'이어서 사용':'새 통'}</div>`;
      }
      const row = document.createElement('div');
      row.className = 'personRow' + (isIn && air && air.c === '#A32D2D' ? ' air-critical' : '');
      row.style.borderLeft = `5px solid ${orgColor(p.org)}`;
      row.innerHTML = `
        <div class="pname">${orgEmoji(p.org)} ${p.name}${roleTag(p)}${badgeHtml}</div>
        <div class="porg" style="color:${orgColor(p.org)};">${p.org} · ${p.rank}</div>
        <div style="margin-top:8px;">${historyHtml(cycles, now)}</div>
        ${airHtml}
      `;
      list.appendChild(row);
    });

    document.getElementById('statIn').textContent = cIn;
    document.getElementById('statOut').textContent = cOut;
    document.getElementById('statWarn').textContent = cWarn;

    if(parOpen) renderParPanel();
  }

  function renderParPanel(){
    const now = Date.now();
    const groups = {};
    let total = 0;
    displayRoster().forEach(p => {
      const cycles = personCycles(p.id);
      const last = cycles[cycles.length-1];
      if(last && last.exitedAt === null){
        total++;
        const key = `${last.floor} · ${last.zone}`;
        if(!groups[key]) groups[key] = [];
        groups[key].push(`${orgEmoji(p.org)} ${p.org}·${p.rank}·${p.name}${roleTag(p)} (${fmtElapsed(now-last.enteredAt)})`);
      }
    });
    const panel = document.getElementById('parPanel');
    let inner;
    if(total === 0){
      inner = '<div class="empty">현재 진입 중인 인원이 없습니다.</div>';
    }else{
      const stamp = new Date(now).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      inner = `<div class="note" style="margin-bottom:8px;">총 ${total}명 · ${stamp} 기준</div>` +
        Object.keys(groups).map(key => `
          <div class="parGroup">
            <div class="parGroupHead">${key} · ${groups[key].length}명</div>
            ${groups[key].map(l => `<div class="hist-line">${l}</div>`).join('')}
          </div>
        `).join('');
    }
    panel.innerHTML = `<div class="parPanelCard">${inner}</div>`;
  }

  document.getElementById('parBtn').addEventListener('click', () => {
    if(parOpen){ parOpen = false; document.getElementById('parPanel').innerHTML = ''; return; }
    parOpen = true;
    renderParPanel();
  });

  setInterval(render, 1000);
  setInterval(fetchAll, 6000);
  fetchAll();
</script>

</body>
</html>
